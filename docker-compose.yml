x-backend-image: &backend-image
  build:
    context: ./backend
    target: dev
  volumes:
    - ./backend:/app

x-database-url: &database-url postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-appdb}

# The address users open in the browser. Everything public is served from here.
x-public-url: &public-url ${PUBLIC_URL:-http://localhost:3000}

# Only the frontend (Caddy) is reachable from other machines. The rest are bound
# to 127.0.0.1 so you can debug them locally without exposing them on a server.

services:

  backend-migrate:
    <<: *backend-image
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  backend:
    <<: *backend-image
    container_name: backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379
      WATCHFILES_FORCE_POLLING: "true"
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_REDIRECT_URI: ${PUBLIC_URL:-http://localhost:3000}/api/integrations/github/callback
      FRONTEND_URL: *public-url
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTH_SERVICE_URL: http://auth:3001
    healthcheck:
      # The python image has no curl or pg_isready, so probe the API with the stdlib.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    environment:
      # :80 = plain HTTP. A hostname (e.g. 203-0-113-10.sslip.io) = automatic HTTPS.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
      - "${HTTPS_PORT:-3443}:443"
    volumes:
      # Certificates and keys; kept so restarts don't request new ones.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      auth:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    build:
      context: ./services/postgres
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    build:
      context: ./services/redis
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  auth-migrate:
    build:
      context: ./services/auth
      target: migrate
    environment: &auth-env
      DATABASE_URL: *database-url
      BETTER_AUTH_URL: *public-url
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:5173}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      GITHUB_LOGIN_CLIENT_ID: ${GITHUB_LOGIN_CLIENT_ID}
      GITHUB_LOGIN_CLIENT_SECRET: ${GITHUB_LOGIN_CLIENT_SECRET}
      GITLAB_LOGIN_CLIENT_ID: ${GITLAB_LOGIN_CLIENT_ID}
      GITLAB_LOGIN_CLIENT_SECRET: ${GITLAB_LOGIN_CLIENT_SECRET}
      BITBUCKET_LOGIN_CLIENT_ID: ${BITBUCKET_LOGIN_CLIENT_ID}
      BITBUCKET_LOGIN_CLIENT_SECRET: ${BITBUCKET_LOGIN_CLIENT_SECRET}
      SEED_DEV_ACCOUNT: ${SEED_DEV_ACCOUNT:-false}
      SEED_DEV_NAME: ${SEED_DEV_NAME:-}
      SEED_DEV_EMAIL: ${SEED_DEV_EMAIL:-}
      SEED_DEV_PASSWORD: ${SEED_DEV_PASSWORD:-}
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      SMTP_FROM: ${SMTP_FROM:-SideProject <no-reply@localhost>}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  auth:
    build:
      context: ./services/auth
      target: prod
    container_name: auth
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      <<: *auth-env
      PORT: 3001
    healthcheck:
      # 127.0.0.1, not localhost: Alpine resolves localhost to IPv6 first, and the server listens on IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/auth/ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    networks:
      - app-network

  # Catches the auth service's emails (verification links etc.) so nothing is
  # really sent. Read them at http://localhost:8025. With a real SMTP_URL in
  # .env, mail goes there instead and this sits unused.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: mailpit
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - app-network

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  app-network: